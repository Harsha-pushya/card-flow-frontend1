<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardFlow | Member Profile</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- AOS Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a1d 0%, #0a0a0b 100%);
      margin: 0;
    }

    .profile-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px;
    }

    .membership-card {
      width: 100%;
      padding: 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .membership-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 242, 255, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .profile-header {
      margin-bottom: 30px;
    }

    .avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent-teal), var(--accent-purple));
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      color: white;
      border: 4px solid var(--glass-border);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    }

    .profile-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      text-align: left;
      margin-bottom: 30px;
    }

    .info-item {
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
    }

    .welcome-msg {
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <div class="glass-card membership-card" data-aos="flip-up">
      <div class="profile-header">
        <div class="avatar-circle">
          <i class="fas fa-user"></i>
        </div>
        <h2 class="welcome-msg">User Profile</h2>
      </div>

      <div class="profile-info">
        <div class="info-item">
          <span class="info-label">Name</span>
          <span class="info-value" id="name">---</span>
        </div>
        <div class="info-item">
          <span class="info-label">Email</span>
          <span class="info-value" id="email">---</span>
        </div>
        <div class="info-item">
          <span class="info-label">Password</span>
          <span class="info-value" id="password">---</span>
        </div>
        <div class="info-item">
          <span class="info-label">Total Cards</span>
          <span class="info-value" id="cards">---</span>
        </div>
      </div>

      <a href="dashboard.html" class="btn-neon">Go to Dashboard <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>
  <script>
    AOS.init();

    document.getElementById("name").textContent = Storage.get("name") || "Guest";
    document.getElementById("email").textContent = Storage.get("email") || "Not provided";
    document.getElementById("password").textContent = Storage.get("password") || "********";
    document.getElementById("cards").textContent = Storage.get("cards") || "0";
  </script>
</body>
</html>
